[package]
name = "git-editor"
version = "2.1.0"
edition = "2021"
rust-version = "1.87"
description = "A command-line tool to edit git commit timestamps, messages, and author information"
license = "MIT"
homepage = "https://github.com/rohansen856/git-editor"
authors = ["Rohan Sen <rohansen856@gmail.com>"]
repository = "https://github.com/rohansen856/git-editor"

[dependencies]
git2 = { version = "0.21", features = ["https", "ssh", "vendored-libgit2"] }
clap = { version = "4.1", features = ["derive"] }
chrono = { version = "0.4.40", features = ["serde"] }
rand = "0.9.1"
regex = "1.7"
colored = "3.0.0"
url = "2.5.4"
crossterm = "0.27"
tempfile = "3.0"
open = "5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serial_test = "3.0"

# Package metadata for .deb packages
[package.metadata.deb]
maintainer = "Rohan Sen <rohansen856@gmail.com>"
copyright = "2024, Rohan Sen <rohansen856@gmail.com>"
license-file = ["LICENSE", "4"]
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    [
        "target/release/git-editor",
        "usr/bin/",
        "755",
    ],
    [
        "README.md",
        "usr/share/doc/git-editor/README",
        "644",
    ],
]
extended-description = """
A powerful command-line tool for editing git commit timestamps, messages, 
and author information. Supports interactive editing, simulation mode, 
and selective field editing.
"""

# Package metadata for .rpm packages
[package.metadata.generate-rpm]
license = "MIT"
summary = "A command-line tool to edit git commit timestamps, messages, and author information"
assets = [
    { source = "target/release/git-editor", dest = "/usr/bin/git-editor", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/git-editor/README.md", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/git-editor/LICENSE", mode = "644" },
]

# Stable GUIDs so each MSI upgrades the previous install (cargo wix init reads these)
[package.metadata.wix]
upgrade-guid = "EFEE90CF-2BBC-441B-96F2-96F71DD2D7BE"
path-guid = "1639BC60-5763-4F1A-902C-CDEE03F36516"
license = false
eula = false
